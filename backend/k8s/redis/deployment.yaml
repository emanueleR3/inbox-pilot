apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: corretto
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: corretto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: redis
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: corretto
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: corretto-secrets
                  key: REDIS_PASSWORD
          command: ["/bin/sh", "-c"]
          args:
            - |
              exec redis-server \
                --appendonly yes \
                --requirepass "$REDIS_PASSWORD"
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # livenessProbe:
          #   tcpSocket:
          #     port: 6379
          #   initialDelaySeconds: 20
          #   periodSeconds: 10
          # readinessProbe:
          #   tcpSocket:
          #     port: 6379
          #   initialDelaySeconds: 5
          #   periodSeconds: 5
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-pvc
