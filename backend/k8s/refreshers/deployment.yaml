apiVersion: apps/v1
kind: Deployment
metadata:
  name: refreshers
  namespace: corretto
  labels:
    app.kubernetes.io/name: refreshers
    app.kubernetes.io/part-of: corretto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: refreshers
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: refreshers
        app.kubernetes.io/name: refreshers
    spec:
      containers:
        - name: refreshers
          image: ghcr.io/correttoai/backend/refreshers:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: corretto-secrets
          resources:
            requests:
              memory: "192Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "200m"
      imagePullSecrets:
        - name: ghcr-secret
