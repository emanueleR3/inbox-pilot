apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-pvc
  namespace: corretto
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: corretto
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
