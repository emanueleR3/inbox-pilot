apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: attachments-pvc
  namespace: corretto
  labels:
    app.kubernetes.io/name: attachments
    app.kubernetes.io/part-of: corretto
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
