# Per ora non usiamo questo file, ma usiamo un secret creato a partire dal .env, con questo comando:
# kubectl create secret generic corretto-secrets \
# --from-env-file=.env \
# -n corretto

apiVersion: v1
kind: Secret
metadata:
  name: corretto-secrets
  namespace: corretto
type: Opaque
stringData:
  # RabbitMQ
  RABBITMQ_USER: "${RABBITMQ_USER}"
  RABBITMQ_PASS: "${RABBITMQ_PASS}"
  RABBITMQ_VHOST: "${RABBITMQ_VHOST}"

  # Redis
  # REDIS_PASSWORD: "${REDIS_PASSWORD}"
  
  # Copia qui le altre variabili dal tuo .env
  # DATABASE_URL: "${DATABASE_URL}"
  # API_KEY: "${API_KEY}"
  # ... altre variabili sensibili
---
# Secret per Google Service Account (da creare separatamente)
# kubectl create secret generic google-service-account \
#   --from-file=service-account-key.json=./listeners/service-account-key.json \
#   -n corretto