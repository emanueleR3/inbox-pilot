apiVersion: v1
kind: Service
metadata:
  name: listeners
  namespace: corretto
  labels:
    app.kubernetes.io/name: listeners
    app.kubernetes.io/part-of: corretto
spec:
  selector:
    app: listeners
  ports:
    - name: webhook
      port: 8001
      targetPort: 8001
      protocol: TCP
      nodePort: 30001
  type: NodePort
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: listeners-ingress
  namespace: corretto
  labels:
    app.kubernetes.io/name: listeners
    app.kubernetes.io/part-of: corretto
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - http:
        paths:
          - path: /webhook
            pathType: Prefix
            backend:
              service:
                name: listeners
                port:
                  number: 8001
