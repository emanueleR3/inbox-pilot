apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: listeners-ingress
  namespace: corretto
  labels:
    app.kubernetes.io/name: listeners
    app.kubernetes.io/part-of: corretto
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # Per Let's Encrypt automatico (se cert-manager è installato)
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  rules:
    - host: listeners.corretto.pro
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: listeners
                port:
                  number: 8001
  # TLS - decommentare dopo aver configurato cert-manager
  # tls:
  #   - hosts:
  #       - listeners.corretto.pro
  #     secretName: listeners-corretto-pro-tls
