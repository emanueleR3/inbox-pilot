apiVersion: apps/v1
kind: Deployment
metadata:
  name: broker-worker
  labels:
    app.kubernetes.io/name: broker-worker
    app.kubernetes.io/part-of: corretto
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: broker-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: broker-worker
        app.kubernetes.io/part-of: corretto
    spec:
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for RabbitMQ to be ready..."
              until nc -z rabbitmq 5672; do
                echo "RabbitMQ is not ready yet, waiting..."
                sleep 5
              done
              echo "RabbitMQ is ready!"
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "32Mi"
              cpu: "50m"
      containers:
        - name: broker-worker
          image: ghcr.io/correttoai/backend/broker:latest
          imagePullPolicy: Always
          command: ["python", "-m", "src.main"]
          envFrom:
            - secretRef:
                name: corretto-secrets
          volumeMounts:
            - name: attachments
              mountPath: /app/attachments
            - name: logs
              mountPath: /app/logs
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: attachments
          hostPath:
            path: /home/deploy/corretto/data/attachments
            type: DirectoryOrCreate
        - name: logs
          hostPath:
            path: /home/deploy/corretto/logs
            type: DirectoryOrCreate
      imagePullSecrets:
        - name: ghcr-secret
