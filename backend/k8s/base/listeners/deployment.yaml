apiVersion: apps/v1
kind: Deployment
metadata:
  name: listeners
  labels:
    app.kubernetes.io/name: listeners
    app.kubernetes.io/part-of: corretto
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: listeners
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: listeners
        app.kubernetes.io/part-of: corretto
    spec:
      containers:
        - name: listeners
          image: ghcr.io/correttoai/backend/listeners:latest
          imagePullPolicy: Always
          ports:
            - name: webhook
              containerPort: 8001
              protocol: TCP
          envFrom:
            - secretRef:
                name: corretto-secrets
          env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /app/credentials/service-account-key.json
          volumeMounts:
            - name: google-credentials
              mountPath: /app/credentials
              readOnly: true
            - name: attachments
              mountPath: /app/attachments
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          # readinessProbe:
          #   httpGet:
          #     path: /health
          #     port: 8001
          #   initialDelaySeconds: 10
          #   periodSeconds: 5
          #   timeoutSeconds: 3
          #   failureThreshold: 3
          # livenessProbe:
          #   httpGet:
          #     path: /health
          #     port: 8001
          #   initialDelaySeconds: 15
          #   periodSeconds: 10
          #   timeoutSeconds: 5
          #   failureThreshold: 3
      volumes:
        - name: google-credentials
          secret:
            secretName: google-service-account
            optional: true
        - name: attachments
          persistentVolumeClaim:
            claimName: attachments-pvc
      imagePullSecrets:
        - name: ghcr-secret
