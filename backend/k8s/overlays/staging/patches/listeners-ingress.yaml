apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: listeners-ingress
spec:
  rules:
    - host: listeners-staging.corretto.pro
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: listeners
                port:
                  number: 8001
  tls:
    - hosts:
        - listeners-staging.corretto.pro
      secretName: listeners-staging-corretto-pro-tls
