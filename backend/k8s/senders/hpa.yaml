apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: senders-hpa
  namespace: corretto
  labels:
    app.kubernetes.io/name: senders
    app.kubernetes.io/part-of: corretto
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: senders
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
      selectPolicy: Max
