apiVersion: apps/v1
kind: Deployment
metadata:
  name: senders
  namespace: corretto
  labels:
    app.kubernetes.io/name: senders
    app.kubernetes.io/part-of: corretto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: senders
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: senders
        app.kubernetes.io/name: senders
    spec:
      containers:
        - name: senders
          image: ghcr.io/correttoai/backend/senders:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8020
              protocol: TCP
          envFrom:
            - secretRef:
                name: corretto-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          # readinessProbe:
          #   httpGet:
          #     path: /health
          #     port: 8020
          #   initialDelaySeconds: 10
          #   periodSeconds: 5
          #   timeoutSeconds: 3
          #   failureThreshold: 3
          # livenessProbe:
          #   httpGet:
          #     path: /health
          #     port: 8020
          #   initialDelaySeconds: 15
          #   periodSeconds: 10
          #   timeoutSeconds: 5
          #   failureThreshold: 3
      imagePullSecrets:
        - name: ghcr-secret
