apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: corretto
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: corretto
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  namespace: corretto
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: corretto
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
