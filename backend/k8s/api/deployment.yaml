apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: corretto
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: corretto
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: api
        app.kubernetes.io/name: api
    spec:
      containers:
        - name: api
          image: ghcr.io/correttoai/backend/api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - secretRef:
                name: corretto-secrets
          env:
            - name: SCRAPINGS_DIR
              value: /app/scrapings
          volumeMounts:
            - name: scrapings
              mountPath: /app/scrapings
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # readinessProbe:
          #   httpGet:
          #     path: /health
          #     port: 8000
          #   initialDelaySeconds: 10
          #   periodSeconds: 5
          #   timeoutSeconds: 3
          #   failureThreshold: 3
          # livenessProbe:
          #   httpGet:
          #     path: /health
          #     port: 8000
          #   initialDelaySeconds: 15
          #   periodSeconds: 10
          #   timeoutSeconds: 5
          #   failureThreshold: 3
      volumes:
        - name: scrapings
          hostPath:
            path: /home/deploy/corretto/data/scrapings
            type: DirectoryOrCreate
      imagePullSecrets:
        - name: ghcr-secret