apiVersion: apps/v1
kind: Deployment
metadata:
  name: automations
  namespace: corretto
  labels:
    app.kubernetes.io/name: automations
    app.kubernetes.io/part-of: corretto
spec:
  replicas: 2
  selector:
    matchLabels:
      app: automations
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: automations
        app.kubernetes.io/name: automations
    spec:
      containers:
        - name: automations
          image: ghcr.io/correttoai/backend/automations:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8010
              protocol: TCP
          envFrom:
            - secretRef:
                name: corretto-secrets
          volumeMounts:
            - name: attachments
              mountPath: /automations/attachments
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8010
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8010
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: attachments
          persistentVolumeClaim:
            claimName: attachments-pvc
      imagePullSecrets:
        - name: ghcr-secret
