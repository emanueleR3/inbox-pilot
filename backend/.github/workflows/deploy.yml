name: CI/CD Deploy to VPS

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker image (broker)
        run: |
          set -e
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHA_TAG=${{ github.sha }}
          BROKER_IMAGE=ghcr.io/${REPO_LOWER}/broker
          docker build -t ${BROKER_IMAGE}:latest -t ${BROKER_IMAGE}:${SHA_TAG} -f broker/worker/Dockerfile broker
          docker push ${BROKER_IMAGE}:latest
          docker push ${BROKER_IMAGE}:${SHA_TAG}

      - name: Build and push Docker image (listeners)
        run: |
          set -e
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHA_TAG=${{ github.sha }}
          LISTENERS_IMAGE=ghcr.io/${REPO_LOWER}/listeners
          docker build -t ${LISTENERS_IMAGE}:latest -t ${LISTENERS_IMAGE}:${SHA_TAG} listeners
          docker push ${LISTENERS_IMAGE}:latest
          docker push ${LISTENERS_IMAGE}:${SHA_TAG}

      - name: Build and push Docker image (refreshers)
        run: |
          set -e
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHA_TAG=${{ github.sha }}
          REFRESHERS_IMAGE=ghcr.io/${REPO_LOWER}/refreshers
          docker build -t ${REFRESHERS_IMAGE}:latest -t ${REFRESHERS_IMAGE}:${SHA_TAG} refreshers
          docker push ${REFRESHERS_IMAGE}:latest
          docker push ${REFRESHERS_IMAGE}:${SHA_TAG}

      - name: Ensure remote directory exists
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /home/deploy/corretto

      - name: Upload docker-compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "/home/deploy/corretto/"

      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            docker pull ghcr.io/${REPO_LOWER}/broker:latest
            docker pull ghcr.io/${REPO_LOWER}/listeners:latest
            docker pull ghcr.io/${REPO_LOWER}/refreshers:latest
            docker compose -f /home/deploy/corretto/docker-compose.yml down || true
            docker compose -f /home/deploy/corretto/docker-compose.yml up -d