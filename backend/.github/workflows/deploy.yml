name: CI/CD Deploy to VPS

on:
  push:
    branches: [ main, test-workflow ]

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed modules
        id: changes
        run: |
          if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          else
            CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)
          fi
          
          echo "Changed files:"
          echo "$CHANGED_FILES"
          
          if echo "$CHANGED_FILES" | grep -q "^api/"; then
            echo "api_changed=true" >> $GITHUB_OUTPUT
          else
            echo "api_changed=false" >> $GITHUB_OUTPUT
          fi
          
          if echo "$CHANGED_FILES" | grep -q "^broker/"; then
            echo "broker_changed=true" >> $GITHUB_OUTPUT
          else
            echo "broker_changed=false" >> $GITHUB_OUTPUT
          fi
          
          if echo "$CHANGED_FILES" | grep -q "^listeners/"; then
            echo "listeners_changed=true" >> $GITHUB_OUTPUT
          else
            echo "listeners_changed=false" >> $GITHUB_OUTPUT
          fi
          
          if echo "$CHANGED_FILES" | grep -q "^refreshers/"; then
            echo "refreshers_changed=true" >> $GITHUB_OUTPUT
          else
            echo "refreshers_changed=false" >> $GITHUB_OUTPUT
          fi
          
          if echo "$CHANGED_FILES" | grep -q "^automations/"; then
            echo "automations_changed=true" >> $GITHUB_OUTPUT
          else
            echo "automations_changed=false" >> $GITHUB_OUTPUT
          fi
          
          if echo "$CHANGED_FILES" | grep -q "^senders/"; then
            echo "senders_changed=true" >> $GITHUB_OUTPUT
          else
            echo "senders_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker image (API)
        if: steps.changes.outputs.api_changed == 'true'
        run: |
          set -e
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHA_TAG=${{ github.sha }}
          API_IMAGE=ghcr.io/${REPO_LOWER}/api
          docker build --no-cache -t ${API_IMAGE}:latest -t ${API_IMAGE}:${SHA_TAG} api
          docker push ${API_IMAGE}:latest
          docker push ${API_IMAGE}:${SHA_TAG}

      - name: Build and push Docker image (broker)
        if: steps.changes.outputs.broker_changed == 'true'
        run: |
          set -e
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHA_TAG=${{ github.sha }}
          BROKER_IMAGE=ghcr.io/${REPO_LOWER}/broker
          docker build --no-cache -t ${BROKER_IMAGE}:latest -t ${BROKER_IMAGE}:${SHA_TAG} -f broker/worker/Dockerfile broker
          docker push ${BROKER_IMAGE}:latest
          docker push ${BROKER_IMAGE}:${SHA_TAG}

      - name: Build and push Docker image (listeners)
        if: steps.changes.outputs.listeners_changed == 'true'
        run: |
          set -e
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHA_TAG=${{ github.sha }}
          LISTENERS_IMAGE=ghcr.io/${REPO_LOWER}/listeners
          docker build --no-cache -t ${LISTENERS_IMAGE}:latest -t ${LISTENERS_IMAGE}:${SHA_TAG} listeners
          docker push ${LISTENERS_IMAGE}:latest
          docker push ${LISTENERS_IMAGE}:${SHA_TAG}

      - name: Build and push Docker image (refreshers)
        if: steps.changes.outputs.refreshers_changed == 'true'
        run: |
          set -e
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHA_TAG=${{ github.sha }}
          REFRESHERS_IMAGE=ghcr.io/${REPO_LOWER}/refreshers
          docker build --no-cache -t ${REFRESHERS_IMAGE}:latest -t ${REFRESHERS_IMAGE}:${SHA_TAG} refreshers
          docker push ${REFRESHERS_IMAGE}:latest
          docker push ${REFRESHERS_IMAGE}:${SHA_TAG}

      - name: Build and push Docker image (automations)
        if: steps.changes.outputs.automations_changed == 'true'
        run: |
          set -e
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHA_TAG=${{ github.sha }}
          AUTOMATIONS_IMAGE=ghcr.io/${REPO_LOWER}/automations
          docker build --no-cache -t ${AUTOMATIONS_IMAGE}:latest -t ${AUTOMATIONS_IMAGE}:${SHA_TAG} automations
          docker push ${AUTOMATIONS_IMAGE}:latest
          docker push ${AUTOMATIONS_IMAGE}:${SHA_TAG}

      - name: Build and push Docker image (senders)
        if: steps.changes.outputs.senders_changed == 'true'
        run: |
          set -e
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHA_TAG=${{ github.sha }}
          SENDERS_IMAGE=ghcr.io/${REPO_LOWER}/senders
          docker build --no-cache -t ${SENDERS_IMAGE}:latest -t ${SENDERS_IMAGE}:${SHA_TAG} senders
          docker push ${SENDERS_IMAGE}:latest
          docker push ${SENDERS_IMAGE}:${SHA_TAG}

      - name: Ensure remote directory exists
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_IP }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /home/deploy/corretto

      - name: Upload docker-compose file to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "/home/deploy/corretto/"

      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_IP }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            
            # Only pull images that were built in this workflow run
            ${{ steps.changes.outputs.api_changed == 'true' && 'docker pull ghcr.io/${REPO_LOWER}/api:latest' || 'echo "Skipping API pull - no changes"' }}
            ${{ steps.changes.outputs.broker_changed == 'true' && 'docker pull ghcr.io/${REPO_LOWER}/broker:latest' || 'echo "Skipping broker pull - no changes"' }}
            ${{ steps.changes.outputs.listeners_changed == 'true' && 'docker pull ghcr.io/${REPO_LOWER}/listeners:latest' || 'echo "Skipping listeners pull - no changes"' }}
            ${{ steps.changes.outputs.refreshers_changed == 'true' && 'docker pull ghcr.io/${REPO_LOWER}/refreshers:latest' || 'echo "Skipping refreshers pull - no changes"' }}
            ${{ steps.changes.outputs.automations_changed == 'true' && 'docker pull ghcr.io/${REPO_LOWER}/automations:latest' || 'echo "Skipping automations pull - no changes"' }}
            ${{ steps.changes.outputs.senders_changed == 'true' && 'docker pull ghcr.io/${REPO_LOWER}/senders:latest' || 'echo "Skipping senders pull - no changes"' }}
            
            docker image prune -a -f --filter "until=24h" || true
            docker compose -f /home/deploy/corretto/docker-compose.yml down || true
            docker compose -f /home/deploy/corretto/docker-compose.yml up -d