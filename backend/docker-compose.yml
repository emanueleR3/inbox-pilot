version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 45s
    networks:
      - broker_net

  broker-worker:
    image: ghcr.io/correttoai/backend/broker:latest
    container_name: broker-worker
    restart: on-failure
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      restart_policy:
        condition: on-failure
        delay: 15s
        max_attempts: 10
    networks:
      - broker_net

  listeners:
    image: ghcr.io/correttoai/backend/listeners:latest
    container_name: listeners
    restart: on-failure
    env_file:
      - .env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/service-account-key.json
    volumes:
      - ./listeners/service-account-key.json:/app/credentials/service-account-key.json:ro
    ports:
      - "8001:8001" # Microsoft webhook
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - broker_net

  refreshers:
    image: ghcr.io/correttoai/backend/refreshers:latest
    container_name: refreshers
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - broker_net

volumes:
  rabbitmq_data:

networks:
  broker_net:
    driver: bridge


