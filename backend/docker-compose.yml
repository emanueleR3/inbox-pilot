version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/app/rabbitmq/rabbitmq.conf
      - ./rabbitmq/definitions.json:/app/rabbitmq/definitions.json
    networks:
      - broker_net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # API + Dashboard
      - "6334:6334" # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - broker_net

  broker-worker:
    image: ghcr.io/correttoai/backend/broker:latest
    container_name: broker-worker
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data/attachments:/app/attachments
    depends_on:
      - rabbitmq
      - qdrant   # <-- aggiunto
    deploy:
      restart_policy:
        condition: on-failure
        delay: 15s
    command: sh -c "sleep 15 && python -m src.main"
    networks:
      - broker_net

  listeners:
    image: ghcr.io/correttoai/backend/listeners:latest
    container_name: listeners
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/service-account-key.json
    volumes:
      - ./listeners/service-account-key.json:/app/credentials/service-account-key.json:ro
      - ./data/attachments:/app/attachments
    depends_on:
      - rabbitmq
      - qdrant   
    ports:
      - "8001:8001"
    networks:
      - broker_net

  refreshers:
    image: ghcr.io/correttoai/backend/refreshers:latest
    container_name: refreshers
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - qdrant
    networks:
      - broker_net

  api:
    image: ghcr.io/correttoai/backend/api:latest
    container_name: api
    restart: unless-stopped
    env_file:
      - .env
    deploy:
      restart_policy:
        condition: on-failure
    depends_on:
      - qdrant   
    ports:
      - "8000:8000"
    networks:
      - broker_net

  automations:
    image: ghcr.io/correttoai/backend/automations:latest
    container_name: automations
    restart: unless-stopped
    volumes:
      - ./data/attachments:/automations/attachments
    env_file:
      - .env
    ports:
      - "8010:8010"
    networks:
      - broker_net
    depends_on:
      - senders
      - qdrant  

  senders:
    image: ghcr.io/correttoai/backend/senders:latest
    container_name: senders
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8020:8020"
    networks:
      - broker_net

volumes:
  rabbitmq_data:
  qdrant_storage: 

networks:
  broker_net:
    driver: bridge
