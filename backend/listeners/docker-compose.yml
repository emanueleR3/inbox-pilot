services:
  listeners:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: listeners
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - POLL_INTERVAL_MINUTES_IMAP=2
      - MICROSOFT_WEBHOOK_PORT=8001
    ports:
      - "8001:8001"  # Microsoft webhook
    volumes:
      - ../listeners/service-account-key.json:/app/credentials/service-account-key.json:ro  # Mount Google credentials from .env path
    networks:
      - broker_net

networks:
  broker_net:
    external: true
