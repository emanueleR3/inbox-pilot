services:
  listeners:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: listeners
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - POLL_INTERVAL_MINUTES_IMAP=2
      - MICROSOFT_WEBHOOK_PORT=8001
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/service-account-key.json
    ports:
      - "8001:8001"  # Microsoft webhook
    volumes:
      #- ./data/corretto/attachments:/app/attachments
      - ./data/attachments:/app/attachments
      - ./service-account-key.json:/app/credentials/service-account-key.json:ro  # Mount Google credentials
    networks:
      - broker_net

networks:
  broker_net:
    external: true
