services:
  listeners:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: listeners
    restart: unless-stopped
    env_file:
      - ../../../../opt/corretto/.env
    environment:
      - POLL_INTERVAL_MINUTES_IMAP=2
      - MICROSOFT_WEBHOOK_PORT=8001
    ports:
      - "8001:8001"  # Microsoft webhook
